name: Duevia failover Keeper

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duevia-failover-keeper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger the secondary Keeper
        env:
          DUEVIA_KEEPER_TOKEN: ${{ secrets.DUEVIA_KEEPER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DUEVIA_KEEPER_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 90 \
            --request POST \
            --header "Authorization: Bearer $DUEVIA_KEEPER_TOKEN" \
            --header "X-Duevia-Keeper-Id: github-actions-failover" \
            https://duevia-rwa.cardrevive-agent.workers.dev/api/keeper/run

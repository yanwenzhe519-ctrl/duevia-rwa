name: Duevia CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Foundry's npm wrapper only selects an optional platform binary; its
      # postinstall command is not portable to Windows and is unnecessary here.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run contracts:compile
      - run: git diff --exit-code -- 'lib/*-artifact.ts'
      - run: npm test
      - run: npm run contracts:test
      - run: npm run bench:incidents
      - run: npm audit --audit-level=high
